name: PocketCode Python conformance tests

on:
  push:
    branches:
      - pocketcode-ai-workflow-director-research-2026-10-28
    paths:
      - "scripts/**"
      - ".github/workflows/pocketcode-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketcode-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out immutable P40 target
        uses: actions/checkout@v4
        with:
          ref: 319cffef121e327331aeaff59522ae279b112ecc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record execution environment
        run: |
          python --version
          python -c "import platform, sqlite3, sys; print('Python:', sys.version); print('SQLite:', sqlite3.sqlite_version); print('OS:', platform.platform())"

      - name: P40 lanes 1 and 2 - release grant and grant-event consumer
        id: lane12
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_release_grant_conformance.py" -v

      - name: P40 lane 3 - effect-dispatch FakeOutbox
        id: lane3
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_fake_outbox.py" -v

      - name: P40 lane 5 - EventJournal
        id: lane5
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_event_journal.py" -v

      - name: P40 lane 6a - result receipts
        id: lane6a
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_result_receipts.py" -v

      - name: P40 lane 6b - execution projection
        id: lane6b
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_execution_projection.py" -v

      - name: Full scripts Python conformance suite
        id: fullsuite
        continue-on-error: true
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Enforce all requested test commands succeeded
        if: always()
        env:
          LANE12: ${{ steps.lane12.outcome }}
          LANE3: ${{ steps.lane3.outcome }}
          LANE5: ${{ steps.lane5.outcome }}
          LANE6A: ${{ steps.lane6a.outcome }}
          LANE6B: ${{ steps.lane6b.outcome }}
          FULLSUITE: ${{ steps.fullsuite.outcome }}
        run: |
          printf 'lane1_2=%s\nlane3=%s\nlane5=%s\nlane6a=%s\nlane6b=%s\nfullsuite=%s\n' "$LANE12" "$LANE3" "$LANE5" "$LANE6A" "$LANE6B" "$FULLSUITE"
          test "$LANE12" = success
          test "$LANE3" = success
          test "$LANE5" = success
          test "$LANE6A" = success
          test "$LANE6B" = success
          test "$FULLSUITE" = success

  # Exact-head lane (added 2026-11-20, owner-authorized): checks out the commit that
  # triggered this run, so a green result is evidence for that commit's tree. The
  # historical job above stays pinned to the P40 target and is reported separately.
  # On failure it mirrors the failing test names and the log tail into one open issue
  # titled "CI log mirror (exact-head lane)" (added 2026-11-21, owner-authorized), so
  # an AI without Actions access can read the failure. The mirror is a copy, not the
  # authoritative record; the Actions run is. Only this job has issues: write.
  unittest-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record triggering SHA and execution environment
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "checked-out HEAD=$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          python --version
          python -c "import platform, sqlite3, sys; print('SQLite:', sqlite3.sqlite_version); print('OS:', platform.platform())"

      - name: Full scripts Python conformance suite at the triggering commit
        id: headsuite
        continue-on-error: true
        shell: bash
        run: python -m unittest discover -s scripts -p "test_*.py" -v 2>&1 | tee head-suite.log

      - name: Mirror the failure summary into the CI log mirror issue
        if: steps.headsuite.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('head-suite.log', 'utf8').split('\n');
            const failed = lines.filter((l) => /^(FAIL|ERROR): /.test(l)).slice(0, 25);
            const tail = lines.slice(-70).join('\n');
            const title = 'CI log mirror (exact-head lane)';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `Run ${context.runId} at ${context.sha}`,
              runUrl,
              '',
              'Failed or errored tests:',
              failed.length ? failed.map((l) => `- ${l}`).join('\n') : '- none matched the FAIL/ERROR pattern (see the tail)',
              '',
              'Last 70 lines of output:',
              '',
              '```',
              tail,
              '```',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            let issue = open.find((i) => i.title === title && !i.pull_request);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title,
                body: 'Copy of failing exact-head test output, posted by the workflow so an AI without Actions access can read it. Not the authoritative record; the Actions run is.',
              });
              issue = created.data;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });

      - name: Enforce the exact-head suite result
        if: always()
        env:
          HEADSUITE: ${{ steps.headsuite.outcome }}
        run: |
          echo "headsuite=$HEADSUITE"
          test "$HEADSUITE" = success
